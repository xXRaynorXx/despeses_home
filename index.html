<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width, initial-scale=1.0">
    <title>Despeses PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Despeses de Casa</h1>
        <p>Control Local Persistent</p>
    </header>

    <div class="grid">
        <!-- FORMULARI -->
        <div class="card">
            <h2 id="form-title">Registrar Despesa</h2>
            <form id="expense-form">
                <input type="hidden" id="expense-id">
                
                <div class="form-group">
                    <label for="concept">Concepte:</label>
                    <input type="text" id="concept" 
                           required placeholder="Ex: Llum">
                </div>
                
                <div class="form-group">
                    <label for="amount">Import (€):</label>
                    <input type="number" id="amount" 
                           step="0.01" required 
                           placeholder="0.00">
                </div>
                
                <div class="form-group">
                    <label for="date">Data:</label>
                    <input type="date" id="date" required>
                </div>
                
                <div class="form-group">
                    <label for="notes">Anotacions:</label>
                    <textarea id="notes" 
                              placeholder="Notes..."></textarea>
                </div>
                
                <button type="submit" id="btn-submit">
                    Guardar Despesa
                </button>
                <button type="button" id="btn-cancel" 
                        class="btn-secondary" 
                        style="display:none;">
                    Cancel·lar
                </button>
            </form>
        </div>

        <!-- FILTRES I TAULA -->
        <div class="card">
            <h2>Filtres Mensuals</h2>
            <div class="flex-filters">
                <select id="filter-year"></select>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <p>Total Filtre</p>
                    <span id="total-selected">0.00 €</span>
                </div>
                <div class="stat-box">
                    <p>Registres</p>
                    <span id="count-selected">0</span>
                </div>
            </div>

            <div class="table-container">
                <table class="excel-table">
                    <thead>
                        <tr>
                            <th>Concepte</th>
                            <th>Gen</th><th>Feb</th><th>Mar</th>
                            <th>Abr</th><th>Mai</th><th>Jun</th>
                            <th>Jul</th><th>Ago</th><th>Set</th>
                            <th>Oct</th><th>Nov</th><th>Des</th>
                        </tr>
                    </thead>
                    <tbody id="expenses-table-body"></tbody>
                </table>
            </div>
        </div>

        <!-- GRÀFICA -->
        <div class="card" style="grid-column: 1 / -1;">
            <h2>📈 Evolució i Increments de Preus</h2>
            
            <div class="flex-filters" style="margin-top: 15px;">
                <div>
                    <label>Concepte:</label>
                    <select id="chart-concept"></select>
                </div>
                <div>
                    <label>Inici:</label>
                    <input type="date" id="chart-start-date">
                </div>
                <div>
                    <label>Fi:</label>
                    <input type="date" id="chart-end-date">
                </div>
            </div>

            <div id="native-chart" 
                 class="native-chart-container"></div>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .catch(err => console.log(err));
        });
    }
</script>
</body>
</html>
